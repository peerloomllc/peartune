manifestVersion: 1
id: peerloom-peartune
name: PearTune
# Hosted on the website because umbrelOS falls back to its OFFICIAL-apps gallery CDN
# when this field is missing, which 404s for community-store apps (generic tile).
# GitHub raw links do not work either: text/plain + nosniff, browsers refuse them.
icon: https://peerloomllc.com/assets/icon-peartune.svg
tagline: Your music, playable anywhere - and shareable with friends
category: media
# The Umbrel LISTING's version, compared against the installed copy to offer updates.
# build-image.sh stamps it from app.json's version on every synced release; the
# out-of-band bumps past 1.0.0 (1.0.1 catch-up, 1.0.2 wma host, 1.0.3 for the
# 0.2.46 seekable-transcode host) exist so installs get offered host updates between
# app releases. Resynced from the live store on 2026-08-29 (1.0.4 = host 0.2.49 + USB
# drives, 1.0.5 = the urgent compose fix; both bumps were made in the store checkout).
# build-image.sh refuses to sync a listing whose version is not GREATER than the one
# the store already carries, so this literal can no longer drift below the store in
# silence.
version: "1.0.5"
port: 8741
description: >-
  Play the music on your Umbrel from anywhere, without exposing your server to the
  internet.


  PearTune connects your phone straight to this machine over an encrypted
  peer-to-peer connection (the Hypercore Protocol). No port forwarding, no VPN, no
  dynamic DNS, no account, and no copy of your library in anyone's cloud. The music
  never leaves your hardware: it streams through the live connection while it plays.


  It reads your existing library. Point it at the Navidrome or Jellyfin you already
  run and it uses that - your tags, your artwork, your album art, and the server's
  transcoding. Or point it at a plain folder of files: PearTune reads the tags itself
  (artist, album, track number, year and embedded cover art), so a folder is a real
  library, not a list of filenames. You choose the source in the dashboard - no
  compose file to edit.


  YOU decide who gets in. Every phone that pairs is a device on this dashboard, with
  a name it chose and a person it belongs to. Revoke a device and the music stops
  within a second, mid-song - not "on next login". Revoke a person and every device
  they hold dies at once. There are no shared passwords or bearer tokens anywhere in
  the design: every connection is authenticated by the phone's own key.


  That is what makes SHARING safe. Your library is not only for your own phones: let a
  friend or a family member in and they get their own place here, with their own
  devices, their own favourites and their own resume points - and no login to pass
  around. Hand out a guest pass that expires by itself, or cut someone off the moment
  you want to. They never get a copy of a single file.


  Pair a phone by scanning the QR code on this dashboard with the PearTune app.
developer: PeerLoom
website: https://peerloomllc.com
dependencies: []
repo: https://github.com/peerloomllc/peartune
support: https://github.com/peerloomllc/peartune/issues
# Full URLs for the same reason `icon:` is one: umbrelOS maps bare filenames to the
# OFFICIAL-apps gallery CDN, which 404s for a community-store app. 2880x1800, which is
# what the official store serves for Navidrome, Jellyfin and Immich. Captured by
# scripts/dashboard-shots.mjs (SHOT_W=1200 SHOT_H=750 SHOT_DPR=2.4).
gallery:
  - https://peerloomllc.com/assets/gallery-peartune-1.jpg
  - https://peerloomllc.com/assets/gallery-peartune-2.jpg
  - https://peerloomllc.com/assets/gallery-peartune-3.jpg
releaseNotes: |-
  New Features
  - Share only part of your library. Tick the folders each person should hear, and everything else disappears for them. It applies while they are listening, and widening it back brings their favourites with it.
  - Sign out every other browser, from the dashboard.
  - Accept a new name from someone's device without moving it elsewhere.
  Improvements
  - A device whose access was removed now says so, instead of looking like a network problem. It remembers while offline, stops retrying and reconnects by itself if you let it back in.
  - Dashboard changes reach a listening phone at once, with no reconnect.
  - Skipping a track stops your server converting music you skipped past.
  - Music one owner adds stops showing as an open request on everyone else's dashboard.
  Bug Fixes
  - Renaming someone no longer changes the name their own phone shows.
  - A device moved to another person mid-song files its progress under the right one.
  - The "Continue listening" card no longer lingers after your session is restored.
  Security
  - Your desktop dashboard now answers only your own computer. A website you had open could previously send it commands. Servers with a password, like Umbrel, were never exposed.
  - The app opens only web, email and payment links, and asks for the camera alone.
  - Your server's identity key and dashboard password are locked down on every read.
path: ""
defaultUsername: ""
# umbrelOS replaces defaultPassword with the derived value when this is set - it is the
# ONLY supported way to show a generated password. `defaultPassword: $APP_PASSWORD` was
# never a token umbrelOS substitutes: the compose DOES get the real value, so the app
# worked, but the UI printed the literal string "$APP_PASSWORD" and nobody could log in
# (found on a real store install, 2026-07-31). No other app in the official store uses it.
deterministicPassword: true
submitter: PeerLoom
submission: https://github.com/peerloomllc/peartune

# NO images: block, and this is now a deliberate CHOICE rather than a gap.
#
# The capture works. scripts/android-screenshots.sh drives the app through six numbered
# scenes and produces six framed PNGs under metadata/android/screenshots/Pixel_9_Framed/.
#
# They are NOT committed, and that is why they cannot be listed here. Every frame renders
# real album art out of a real library (see scripts/screenshot-fixture.sh) - fine in a store
# listing, not fine in a public MIT repo's git history - so both the fixture and the captures
# are gitignored. Pointing this file at those paths would fail the publish on a clean
# checkout, which is worse than shipping without images.
#
# To publish with screenshots, either commit a set built from art that can be committed, or
# host them somewhere the publish step can fetch. Regenerate any time:
#   ./scripts/android-screenshots.sh

metadata_sources:

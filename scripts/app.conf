# PearTune release configuration.
#
# Sourced with `set -a` by scripts/release.sh, then scripts/.env is sourced AFTER
# this so secrets always win. See /home/tim/peerloomllc/RELEASE-PIPELINE.md for the
# canonical step order this file feeds.
#
# NOTHING SECRET BELONGS HERE. This file is committed; scripts/.env is not.

APP_NAME=PearTune                            # Display name (used in logs, Nostr posts)
BUNDLE_ID=com.peartune                       # iOS bundle ID and Android package name
ARTIFACT_PREFIX=peartune                     # Prefix for APK/AAB filenames (e.g. peartune-v0.1.0.apk)

# ios/ is NOT committed in this repo - `expo prebuild` generates it, so these paths
# only exist after a prebuild. (Note android/ IS committed here, unlike the sibling
# apps; see the repo CLAUDE.md.)
XCODE_WORKSPACE=ios/PearTune.xcworkspace
XCODE_SCHEME=PearTune
XCODE_PROJECT=ios/PearTune.xcodeproj/project.pbxproj
IOS_PROVISIONING_PROFILE="PearTune Distribution"

KEY_ALIAS_DEFAULT=peartune

# The Mac mini builds every iOS artifact. UNLIKE the sibling apps this is an rsync
# TARGET, not a git clone - scripts/ios-device-build.sh pushes the tree to
# ~/peartune-ios and builds there. Two consequences worth remembering:
#   * rsync overwrites the Mac's bare bundle with the LINUX one, so `npm run build:ui
#     && npm run build:bare` must run ON the Mac afterwards or require.addon crashes.
#   * a step that assumes it can `git pull` on the Mac will not work here.
MAC_MINI_REPO_PATH="peartune-ios"

APP_TAGLINE="Your music collection, playable anywhere, without exposing your server to the internet."
APP_WEBSITE=https://peerloomllc.com/peartune/
NOSTR_HASHTAGS="#PearTune #P2P #selfhosted #music #privacy #bitcoin #zapstore #Android #iOS"

# Screenshots. Pixel_9 is an x86_64 AVD, so an emulator build needs
# `-PreactNativeArchitectures=x86_64` and the arm64 build must be restored before
# touching a phone.
#
# THE iOS SIMULATOR HERE IS A **PRO MAX**, AND THAT IS NOT A PREFERENCE. App Store
# Connect's iPhone upload slots are 6.9" (1320x2868) and 6.7" (1290x2796). The
# standing PearTune-Test simulator is an iPhone 16 Pro - the 6.3" class, 1206x2622 -
# so every frame it produces is a size the store has no slot for. Discovered
# 2026-07-31 with six perfectly good screenshots already captured at the wrong size.
# PearTune-Shots is an iPhone 16 Pro Max and renders 1320x2868 natively.
# PearTune-Test is still the right simulator for everything that is not a store frame.
IOS_SCREENSHOT_DEVICES="PearTune-Shots|D51177DB-33AA-424D-9F1E-883B70073FEC"
ANDROID_APP_ID="com.peartune.debug"
ANDROID_MAIN_ACTIVITY="com.peartune.debug/com.peartune.MainActivity"
ANDROID_SCREENSHOT_AVDS="Pixel_9"

# ---------------------------------------------------------------------------
# PearTune-only capabilities. Every other app in the suite ships a SEEDER - an
# optional extra replica for a phone-to-phone app. PearTune ships a HOST, which is
# the sole source of the music, so these are not the same thing wearing a new name
# and the steps that handle them differ.
# ---------------------------------------------------------------------------

# Step 5b - the desktop tray host (Electron). AppImage + .deb on Linux, NSIS .exe on
# Windows (cross-built via wine), .dmg on macOS (must build ON the Mac; electron-builder
# cannot target macOS from Linux). macOS is signed but NOT notarized and Windows is
# unsigned, so both warn on first open until that is wired.
DESKTOP_DIR=desktop
DESKTOP_BUILD_LINUX="npm run build:linux"
DESKTOP_BUILD_WINDOWS="npm run build:windows"
DESKTOP_BUILD_MAC="npm run build:mac"

# Step 5c - the multi-arch host image (amd64 + arm64), which the Umbrel app runs.
# build-image.sh pins the digest into EVERY file that names the image; it used to pin
# only redeploy-umbrel.sh, which is how five files drifted to a 30-version-old tag.
HOST_IMAGE=ghcr.io/peerloomllc/peartune-host
HOST_IMAGE_BUILD="bash host/build-image.sh"

# Step 13c - the Umbrel community store listing. NOT yet published; see TODO.md for
# what still gates it (folder-mode metadata, and confirming where an Umbrel user's
# music actually lives - the compose may still point at the wrong path).
UMBREL_DIR=umbrel

# NO STARTOS / START9 STEPS. Start9 releases are TABLED (Tim, 2026-07-29): a host works
# there but every byte relays, because StartOS runs each service behind a container NAT
# that holepunching cannot cross. Measured; see start9/README.md and
# proposals/2026-07-29-start9-bindportrange.md.
#
# So this app has NO step 5d (.s9pk build) and NO step 7b (StartOS registry refresh).
# Per the pipeline contract those numbers are SKIPPED, never reused or renumbered - the
# gap is how check-release-pipeline.sh tells "absent" from "misplaced".
